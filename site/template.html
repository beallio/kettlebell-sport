<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="generator" content="README.md + scripts/build-site.mjs">
  <title>{{SITE_TITLE}}</title>
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="mobile-header">
    <button class="mobile-menu-button" type="button" aria-expanded="false" aria-controls="siteSidebar">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span class="sr-only">Open navigation</span>
    </button>
    <a class="mobile-brand" href="#top">{{SITE_TITLE}}</a>
    <a class="mobile-github" href="https://github.com/beallio/kettlebell-sport" target="_blank" rel="noopener noreferrer" aria-label="Open the GitHub repository">GitHub ↗</a>
  </header>

  <aside class="sidebar" id="siteSidebar" aria-label="Site navigation">
    <div class="sidebar-inner">
      <a class="sidebar-brand" href="#top">{{SITE_TITLE}}</a>

      <div class="sidebar-navigation">
        <p class="sidebar-label">Contents</p>
        <nav class="toc" aria-label="README sections">
          {{NAV_LINKS}}
        </nav>
      </div>

      <div class="sidebar-tools">
        <label class="search-label" for="search">Search resources</label>
        <div class="search-field">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"></circle><path d="m13 13 4 4"></path></svg>
          <input id="search" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
          <output id="searchCount" for="search" aria-live="polite">{{RESOURCE_COUNT}}</output>
        </div>
      </div>

      <nav class="sidebar-meta" aria-label="Project links">
        <a href="https://github.com/beallio/kettlebell-sport/blob/main/README.md" target="_blank" rel="noopener noreferrer">README</a>
        <a href="https://github.com/beallio/kettlebell-sport" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </nav>
    </div>
  </aside>

  <button class="sidebar-scrim" type="button" aria-label="Close navigation" tabindex="-1"></button>

  <main class="site-main" id="content">
    <div class="content-shell" id="top">
      <header class="document-header">
        <h1>{{SITE_TITLE}}</h1>
        {{LEAD_MEDIA}}
      </header>

      <article class="document">
        {{DOCUMENT}}
      </article>

      <div class="no-results" id="noResults" hidden>
        <h2>No matching resources</h2>
        <p>Try a broader search term.</p>
      </div>

      <footer class="document-footer">
        <a href="#top">Back to top ↑</a>
      </footer>
    </div>
  </main>
</body>
</html>
